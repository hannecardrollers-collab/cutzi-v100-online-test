name: Apply Cutzi dev fullscreen near black

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cutzi-dev-fullscreen-near-black.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply near-black fullscreen
        run: python .github/scripts/apply_cutzi_dev_fullscreen_near_black.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Refine Cutzi dev fullscreen contrast"
          git push origin HEAD:main
