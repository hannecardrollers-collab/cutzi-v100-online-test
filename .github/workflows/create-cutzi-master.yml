name: Create Cutzi master ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-cutzi-master.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build master ZIP
        run: |
          mkdir -p master/Cutzi-MASTER
          cp -R public functions master/Cutzi-MASTER/
          cp schema.sql package.json README.md DEPLOY-STAPPEN.md SHA256.txt TEST-RESULTS.md master/Cutzi-MASTER/
          cd master
          zip -r ../Cutzi-MASTER.zip Cutzi-MASTER
      - uses: actions/upload-artifact@v4
        with:
          name: Cutzi-MASTER
          path: Cutzi-MASTER.zip
          if-no-files-found: error
