name: Apply Cutzi v100.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cutzi-v1006.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v100.6
        run: |
          sed -i 's/3764551e13823d1ebe2ba9d87d30649731b2cb94/f27da6c82980593d8bd29cc64cb14151b1498429/' .github/scripts/apply_cutzi_v1006.py
          python .github/scripts/apply_cutzi_v1006.py
      - name: Verify and commit
        run: |
          test "$(git hash-object public/index.html)" = "f27da6c82980593d8bd29cc64cb14151b1498429"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Deploy Cutzi v100.6 agenda fullscreen"
          git push origin HEAD:main
