name: Apply Cutzi real glass fullscreen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cutzi-dev-fullscreen-real-glass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply real glass fullscreen tweak
        run: python .github/scripts/apply_cutzi_dev_fullscreen_real_glass.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Make Cutzi fullscreen genuinely transparent"
          git push origin HEAD:main
