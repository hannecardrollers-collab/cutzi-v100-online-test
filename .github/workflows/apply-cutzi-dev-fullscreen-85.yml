name: Apply Cutzi dev fullscreen 85 percent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cutzi-dev-fullscreen-85.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fullscreen 85 percent
        run: python .github/scripts/apply_cutzi_dev_fullscreen_85.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Set Cutzi dev fullscreen to 85 percent black"
          git push origin HEAD:main
