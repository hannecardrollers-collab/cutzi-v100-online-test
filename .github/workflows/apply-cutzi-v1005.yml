name: Apply Cutzi v100.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cutzi-v1005.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v100.5
        run: python .github/scripts/apply_cutzi_v1005.py
      - name: Verify and commit
        run: |
          test "$(git hash-object public/index.html)" = "c821ae185126a8a4d5b478ded37dbea4c138c320"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Deploy Cutzi v100.5"
          git push origin HEAD:main
